name: Fork build (BLE)

on:
  push:
    branches:
      - main
      - master
      - "ble/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ble-framing-tests:
    name: BLE framing tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Build with warnings as errors and sanitizers
        run: >
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-sanitize-recover=all
          -I src/transport
          tests/native/ble_framing/runner.c src/transport/ble_framing.c
          -o ble_framing_tests

      - name: Run tests
        run: ./ble_framing_tests

  build:
    name: build ${{ matrix.profile }}
    needs: ble-framing-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - usb
          - nfc
          - full
    env:
      UV_PYTHON: "3.14"
      ZEROFIDO_PROFILE: ${{ matrix.profile }}
      ZEROFIDO_RELEASE_DIAGNOSTICS: "0"
      ZEROFIDO_USB_DIAGNOSTICS: "0"
      ZEROFIDO_AUTO_ACCEPT_REQUESTS: "0"
      ZEROFIDO_DEV_SCREENSHOT: "0"
      ZEROFIDO_DEV_FIDO2_1: "0"
      ZEROFIDO_PACKED_ATTESTATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync tools
        run: uv sync --locked

      - name: Build FAP with ufbt
        run: uv run python -m ufbt

      - name: Package release FAP
        run: >
          uv run python host_tools/package_release.py
          --skip-build
          --allow-prebuilt-input
          --fap dist/zerofido.fap
          --output-fap dist/zerofido-ble-fork-${{ matrix.profile }}.fap

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zerofido-ble-fork-${{ matrix.profile }}
          if-no-files-found: error
          path: dist/zerofido-ble-fork-${{ matrix.profile }}.fap
